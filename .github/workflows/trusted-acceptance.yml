name: Trusted acceptance

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: trusted-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pinned-harness:
    name: Trusted acceptance / pinned harness
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Verify candidate against protected trust root
        env:
          TRUSTED_MANIFEST_SHA256: ${{ vars.MATHEWS_ACCEPTANCE_MANIFEST_SHA256 }}
        working-directory: candidate
        run: |
          test -n "$TRUSTED_MANIFEST_SHA256"
          actual_manifest_sha256="$(sha256sum ACCEPTANCE_CONTRACT.sha256 | cut -d ' ' -f 1)"
          test "$actual_manifest_sha256" = "$TRUSTED_MANIFEST_SHA256"
          sha256sum --check ACCEPTANCE_CONTRACT.sha256
