name: Acceptance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Acceptance / test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify pinned toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          test "$(xcodebuild -version | paste -sd ' ' -)" = \
            "Xcode 26.2 Build version 17C52"
          xcrun simctl list runtimes available | grep -F "iOS 26.2"
          xcrun simctl list devicetypes | grep -F "iPhone 17"

      - name: Verify pinned harness closure
        env:
          TRUSTED_MANIFEST_SHA256: ${{ vars.MATHEWS_ACCEPTANCE_MANIFEST_SHA256 }}
        run: |
          test -n "$TRUSTED_MANIFEST_SHA256"
          actual_manifest_sha256="$(shasum -a 256 ACCEPTANCE_CONTRACT.sha256 | cut -d ' ' -f 1)"
          test "$actual_manifest_sha256" = "$TRUSTED_MANIFEST_SHA256"
          shasum -a 256 -c ACCEPTANCE_CONTRACT.sha256

      - name: Create clean pinned simulator
        id: simulator
        run: |
          device_udid="$(xcrun simctl create \
            MathewsAcceptance \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17 \
            com.apple.CoreSimulator.SimRuntime.iOS-26-2)"
          echo "device_udid=$device_udid" >> "$GITHUB_OUTPUT"
          xcrun simctl shutdown "$device_udid" || true
          xcrun simctl erase "$device_udid"
          xcrun simctl boot "$device_udid"
          xcrun simctl bootstatus "$device_udid" -b

      - name: Build and install exact candidate
        env:
          DEVICE_UDID: ${{ steps.simulator.outputs.device_udid }}
        run: |
          xcodebuild build \
            -project mathews-ios-acceptance.xcodeproj \
            -scheme mathews-ios-acceptance \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO
          xcrun simctl install \
            "$DEVICE_UDID" \
            "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/mathews-ios-acceptance.app"

      - name: Run pinned primary journey
        env:
          DEVICE_UDID: ${{ steps.simulator.outputs.device_udid }}
          TZ: UTC
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace MathewsAcceptance.xcworkspace \
            -scheme MathewsAcceptance \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            -only-testing:MathewsAcceptanceUITests/PrimaryJourneyTests/testPrimaryJourney \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Acceptance.xcresult" \
            -testLanguage en \
            -testRegion US \
            CODE_SIGNING_ALLOWED=NO

      - name: Delete acceptance simulator
        if: always() && steps.simulator.outputs.device_udid != ''
        env:
          DEVICE_UDID: ${{ steps.simulator.outputs.device_udid }}
        run: xcrun simctl delete "$DEVICE_UDID"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: acceptance-xcresult
          path: ${{ runner.temp }}/Acceptance.xcresult
          retention-days: 7
